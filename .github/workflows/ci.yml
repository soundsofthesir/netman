name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/NetMan.App -c Release -r win-x64 --self-contained -o out

      - uses: actions/upload-artifact@v4
        with:
          name: NetMan
          path: out/NetMan.exe
